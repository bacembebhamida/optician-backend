spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:opticiandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    com.optician: DEBUG
    org.springframework.security: DEBUG

app:
  bootstrap:
    admin:
      full-name: Administrateur OptiVision
      email: admin@optivision.tn
      password: Admin123!
